global:
  scrape_interval: 30s
  external_labels:
    monitor: "GMI Prometheus"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # DGX Spark (GB10) — runs dgx_collector.py on the remote host.
  # DGX_HOST must be set; DGX_COLLECTOR_PORT defaults to 9273.
  - job_name: "dgx-spark"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["${DGX_HOST}:${DGX_COLLECTOR_PORT:-9273}"]

  # SGLang / model serving metrics on the same DGX host.
  # DGX_SGLANG_PORT defaults to 8888.
  - job_name: "dgx-spark-sglang"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["${DGX_HOST}:${DGX_SGLANG_PORT:-8888}"]

  # LiteLLM dedicated Prometheus metrics port (no auth).
  # LITELLM_HOST must be set; LITELLM_METRICS_PORT defaults to 4001.
  - job_name: "litellm-dedicated"
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["${LITELLM_HOST}:${LITELLM_METRICS_PORT:-4001}"]
