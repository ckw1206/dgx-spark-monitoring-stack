services:
  prometheus:
    image: prom/prometheus:latest
    user: "0:0"
    container_name: prometheus
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "32m"
        max-file: "4"
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEMORY_LIMIT:-4g}
    volumes:
      - ./scripts/start.sh:/start.sh:ro
      - ./conf_prom/prometheus.tpl.yml:/prometheus/prometheus.tpl.yml:ro
      - ${PROMETHEUS_DATA_DIR:-/data/prometheus_data}:/prometheus/data
    entrypoint: ["/bin/sh", "/start.sh"]
    networks:
      - monitoring
    environment:
      - DGX_HOST=${DGX_HOST}
      - DGX_COLLECTOR_PORT=${DGX_COLLECTOR_PORT:-9273}
      - DGX_SGLANG_PORT=${DGX_SGLANG_PORT:-8888}
      - DGX_INFERENCE_PORT=${DGX_INFERENCE_PORT:-8000}
      - LITELLM_HOST=${LITELLM_HOST}
      - LITELLM_METRICS_PORT=${LITELLM_METRICS_PORT:-4001}

  grafana:
    # grafana/grafana is the OSS image; grafana/grafana-oss stopped at 13.0.2.
    image: grafana/grafana:${GRAFANA_VERSION:-13.3.2}
    container_name: grafana
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "16m"
        max-file: "4"
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEMORY_LIMIT:-4g}
    user: "0"
    volumes:
      - ./conf_grafana/provisioning:/etc/grafana/provisioning
      - ${GRAFANA_DATA_DIR:-/data/grafana_data}:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Pinned; installed in the background on first start (needs grafana.com).
      # Grafana Assistant requires Grafana >= 13.1.
      - GF_PLUGINS_PREINSTALL=grafana-assistant-app@2.1.19
    # Refuse to start without an admin password (no admin/admin fallback).
    # Checked here, not with ${VAR:?}, so `docker compose ps/logs/down` work without it.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "ERROR: GRAFANA_ADMIN_PASSWORD is not set" >&2; exit 1; }; exec /run.sh "$$@"'
      - --
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
