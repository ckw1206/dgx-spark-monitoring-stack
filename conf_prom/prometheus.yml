global:
  scrape_interval: 30s
  external_labels:
    monitor: "GMI Prometheus"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # DGX Spark (GB10) — runs dgx_collector.py on the remote host.
  # Set DGX_HOST to the DGX Spark IP (env var), e.g. 192.168.1.100.
  # Ensure port 9273 is reachable through the firewall.
  - job_name: "dgx-spark"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["${DGX_HOST}:9273"]

# Add more remote targets below, e.g.:
#   - job_name: "another-host"
#     static_configs:
#       - targets: ["192.168.1.101:9273"]
